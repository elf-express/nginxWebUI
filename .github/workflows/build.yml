name: Build & Test & Release

# push dev/release/hotfix/** 與 PR → build/test；不發布、不建立 tag。
# 人推送 v* tag 或 workflow_dispatch 指定既有 tag → verify → build/test → 發布。
# build/test = Maven（含 JUnit／前端測試）+ Node 單元測試 + Playwright E2E。
on:
  push:
    branches: [dev, release, 'hotfix/**']
    tags: ['v*']
  pull_request:
    branches: [dev, release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v5.3.0'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 所有 tag 與手動發布共用一把鎖，避免版本映像、latest 與 GitHub Release 競態。
# branch／PR CI 各自分組；只有 PR 設 cancel-in-progress，發布不取消進行中的 run。
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) &&
        'nginxwebui-publish' || format('build-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify release tag
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Verify tag version and release ancestry
        id: verify
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected an existing vX.Y.Z tag, got $TAG"
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$TAG"

          # Read only the direct project version, never the Solon parent version.
          version=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("pom.xml").getroot().findtext("{http://maven.apache.org/POM/4.0.0}version", default=""))')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match pom.xml project version $version"
            exit 1
          fi

          git fetch --no-tags origin refs/heads/release:refs/remotes/origin/release
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$(git rev-parse HEAD)" != "$commit" ]; then
            echo "::error::Checkout does not match tag $TAG"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/release; then
            echo "::error::Tag $TAG is not on origin/release. Fast-forward release before tagging."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Test
    needs: verify
    # verify 成功或跳過才跑；失敗或取消均不跑。
    if: >-
      ${{ always() && !cancelled() &&
          (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.commit || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build + JUnit
        run: mvn -B clean package

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      # --with-deps 會跑 apt-get;Ubuntu 鏡像卡住時讓它在 15 分內失敗,而不是佔住 concurrency group 6 小時
      - name: Install Node deps + Chromium
        timeout-minutes: 15
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # runner 預裝 nginx;E2E 以「沒有 nginx」為前提(InitConfig 偵測到會自動設 nginxExe 並跑 nginx -t 預檢)
      - name: Remove preinstalled nginx
        run: |
          sudo apt-get purge -y -qq 'nginx*' >/dev/null || true
          if command -v nginx; then echo "nginx still on PATH"; exit 1; fi

      - name: Node unit tests
        run: npm run test:unit

      - name: Playwright E2E
        run: npm run test:fast

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Release image (${{ matrix.image.name }})
    needs: [verify, build]
    runs-on: ubuntu-latest
    # 發版事件、tag 驗證和測試都通過後才發布；一般分支／PR 一律跳過。
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) &&
          needs.verify.result == 'success' && needs.build.result == 'success' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: nginxwebui
            dockerfile: Dockerfile
            context: .
            needs_mvn: true
          - name: nginxwebui-crowdsec
            dockerfile: docker/crowdsec/Dockerfile
            context: docker/crowdsec
            needs_mvn: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.commit }}

      # 先登入,version-gate 的 manifest inspect 才能查 private package(否則必失敗→每次重發)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if this version already on ghcr
        id: exists
        run: |
          if docker manifest inspect ghcr.io/elf-express/${{ matrix.image.name }}:${{ needs.verify.outputs.version }} >/dev/null 2>&1; then
            echo "PUBLISHED=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.image.name }}:${{ needs.verify.outputs.version }} 已存在 → 跳過發布"
          else
            echo "PUBLISHED=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.image.name }}:${{ needs.verify.outputs.version }} 尚未發布 → 將 build+push"
          fi

      - name: Set up JDK 17
        if: steps.exists.outputs.PUBLISHED == 'false' && matrix.image.needs_mvn
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        if: steps.exists.outputs.PUBLISHED == 'false' && matrix.image.needs_mvn
        run: mvn clean package -DskipTests -q

      - name: Set up Docker Buildx
        if: steps.exists.outputs.PUBLISHED == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and Push (amd64)
        if: steps.exists.outputs.PUBLISHED == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/elf-express/${{ matrix.image.name }}:${{ needs.verify.outputs.version }}
            ghcr.io/elf-express/${{ matrix.image.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  github_release:
    name: GitHub Release
    needs: [verify, release]
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) &&
          needs.verify.result == 'success' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.commit }}

      - name: Create GitHub Release if new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG 已存在，跳過"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "nginxWebUI $TAG" \
              --verify-tag \
              --generate-notes
          fi

  ci:
    name: ci
    needs: [verify, build, release, github_release]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check required job results
        env:
          IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          IMAGE_RESULT: ${{ needs.release.result }}
          RELEASE_RESULT: ${{ needs.github_release.result }}
        run: |
          test "$BUILD_RESULT" = success
          if [ "$IS_RELEASE" = true ]; then
            test "$VERIFY_RESULT" = success
            test "$IMAGE_RESULT" = success
            test "$RELEASE_RESULT" = success
          else
            test "$VERIFY_RESULT" = skipped
            test "$IMAGE_RESULT" = skipped
            test "$RELEASE_RESULT" = skipped
          fi
