name: Build & Test & Release

# Trigger 模型:
#   push dev                  → build/test(不 push image)
#   push master               → build/test + release(pom 版本在 ghcr 沒有才 build+push+tag)
#   pull_request→dev/master   → build/test
#   build/test = mvn package(含 JUnit)+ Node 單元測試 + Playwright E2E,任一失敗即中斷
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 同一 PR 連續 push 時取消前一次;push 不取消,避免中斷 master 的發版
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build + JUnit
        run: mvn -B clean package

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Node deps + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # runner 預裝 nginx;E2E 以「沒有 nginx」為前提(InitConfig 偵測到會自動設 nginxExe 並跑 nginx -t 預檢)
      - name: Remove preinstalled nginx
        run: |
          sudo apt-get purge -y -qq 'nginx*' >/dev/null || true
          if command -v nginx; then echo "nginx still on PATH"; exit 1; fi

      - name: Node unit tests
        run: npm run test:unit

      - name: Playwright E2E
        run: npm run test:fast

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Release image (${{ matrix.image.name }})
    needs: build
    runs-on: ubuntu-latest
    # 只在 push master 時跑(版本閘控:pom 版本在 ghcr 沒有才 build+push)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: nginxwebui
            dockerfile: Dockerfile
            context: .
            needs_mvn: true
          - name: nginxwebui-crowdsec
            dockerfile: docker/crowdsec/Dockerfile
            context: docker/crowdsec
            needs_mvn: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract version from pom.xml
        id: version
        run: |
          VER=$(grep -A1 'artifactId>nginxWebUI' pom.xml | grep version | grep -oP '\d+\.\d+\.\d+')
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"
          echo "pom 版本: $VER"

      # 先登入,version-gate 的 manifest inspect 才能查 private package(否則必失敗→每次重發)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if this version already on ghcr
        id: exists
        run: |
          if docker manifest inspect ghcr.io/elf-express/${{ matrix.image.name }}:${{ steps.version.outputs.VERSION }} >/dev/null 2>&1; then
            echo "PUBLISHED=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.image.name }}:${{ steps.version.outputs.VERSION }} 已存在 → 跳過發布"
          else
            echo "PUBLISHED=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.image.name }}:${{ steps.version.outputs.VERSION }} 尚未發布 → 將 build+push"
          fi

      - name: Set up JDK 17
        if: steps.exists.outputs.PUBLISHED == 'false' && matrix.image.needs_mvn
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        if: steps.exists.outputs.PUBLISHED == 'false' && matrix.image.needs_mvn
        run: mvn clean package -DskipTests -q

      - name: Set up Docker Buildx
        if: steps.exists.outputs.PUBLISHED == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and Push (amd64)
        if: steps.exists.outputs.PUBLISHED == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/elf-express/${{ matrix.image.name }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/elf-express/${{ matrix.image.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  tag:
    name: Auto-tag + GitHub Release
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create v<version> tag if new
        run: |
          VER=$(grep -A1 'artifactId>nginxWebUI' pom.xml | grep version | grep -oP '\d+\.\d+\.\d+')
          # 查遠端(checkout 是淺 clone、不含 tags,不能用 local git rev-parse)
          if git ls-remote --exit-code --tags origin "v$VER" >/dev/null 2>&1; then
            echo "tag v$VER 已存在(遠端),跳過"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VER" -m "Release v$VER"
            git push origin "v$VER"
            echo "已打並推送 tag v$VER"
          fi

      # git tag ≠ GitHub Release entry；這步用內建 GITHUB_TOKEN 自動建 Release
      # (需要 job 上方的 permissions.contents: write；不受本地組織 PAT 政策影響)
      - name: Create GitHub Release if new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -A1 'artifactId>nginxWebUI' pom.xml | grep version | grep -oP '\d+\.\d+\.\d+')
          # 冪等:release 已存在就跳過(重跑 CI 不會重複建)
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release v$VER 已存在,跳過"
          else
            gh release create "v$VER" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v$VER" \
              --target master \
              --generate-notes
            echo "已建立 GitHub Release v$VER"
          fi
