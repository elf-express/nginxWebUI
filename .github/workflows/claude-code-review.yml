name: Claude Code Review

# Claude Code PR Review — 需人工同意:有人在 PR 加上 `claude-review` label 才會審查並留言。
# PR 開啟或 push 不會自動觸發;要重審最新一版,移除 label 再加回去。
# 與 claude.yml(@claude 互動)互補。
# 認證:沿用同一 repo secret CLAUDE_CODE_OAUTH_TOKEN(Claude Max OAuth token,`claude setup-token` 產生)。
# 官方文件:https://code.claude.com/docs/en/github-actions

on:
  pull_request:
    types: [labeled]

# 同一 PR 重複觸發時,取消前一次未完成的 review,只 review 最新一版(省額度)
concurrency:
  # 帶 label 名稱,加其他 label 不會取消進行中的 review
  group: claude-review-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  claude-review:
    # 只在加上 claude-review label 時執行;略過 draft PR,避免半成品白燒 Agent SDK 額度與 Actions 分鐘
    if: github.event.label.name == 'claude-review' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read # 讀程式碼做 review
      pull-requests: write # 在 PR 留 review 留言
      id-token: write # OIDC — claude-code-action 交換 GitHub token(缺這行會 "Could not fetch an OIDC token")
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: dependabot[bot]
          # 直接給 review 任務(不需 @claude 提及)
          prompt: |
            請 review 這個 PR,並用繁體中文在 PR 留言。聚焦:
            - Bug、邏輯錯誤、未處理的邊界情況
            - 安全性:輸入驗證、注入、認證授權
            - 專案慣例(見 CLAUDE.md):Solon 非 Spring、SqlHelper 非 JPA;
              新使用者可見字串必須同步三份 messages*.properties(簡/繁/英);
              a11y 不可用 <a href="javascript:"> 假連結(改用 <button>);
              前端第三方 lib 不可依賴外網 CDN(離線部署)
            - 對應的 Playwright E2E 測試是否齊備
            只點出真正重要的問題,附檔案/行號與具體修法;不要吹毛求疵。
            最後用 `gh pr comment` 留一則總結。
          # gh 指令須明列於 --allowedTools,否則讀 diff / 留言會被權限擋下
          # Read/Glob/Grep 讓審查能讀 checkout 下來的檔案;被擋的工具呼叫也會耗掉回合數
          claude_args: >-
            --max-turns 30
            --model claude-sonnet-4-6
            --allowedTools "Read,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
