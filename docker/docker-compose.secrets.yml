# 選用：把 CrowdSec bouncer 金鑰與 machine 密碼改用 secrets 檔傳遞，不再出現在容器環境變數 / docker inspect。
# 基礎 docker-compose.yml 不含 secrets:（缺檔時 docker compose up 會直接失敗，會擋掉沒用 CrowdSec 的部署），
# 所以只在要用時才疊上這個檔：
#
#   mkdir -p secrets
#   openssl rand -hex 32 | tr -d '\n' > secrets/crowdsec_bouncer_key
#   openssl rand -hex 32 | tr -d '\n' > secrets/crowdsec_machine_password
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml --profile security up -d
#
# 這個檔需要搭配 security profile，並且不用在 .env 填 CROWDSEC_BOUNCER_KEY / CROWDSEC_MACHINE_PASSWORD
# （下面會把兩個容器的對應環境變數清空）。
# - nginxwebui：nginxWebUI 優先讀 /run/secrets/crowdsec_bouncer_key 與 /run/secrets/crowdsec_machine_password。
# - crowdsec：官方 image 沒有 BOUNCER_KEY_nginx_FILE，但啟動時會掃 /run/secrets/bouncer_key_*，
#   檔名 bouncer_key_nginx 的最後一段（nginx）就是 bouncer 名稱，所以把同一個 secret 以這個檔名掛進去。
#   machine 密碼由自建 image 的啟動包裝（/nwu-start.sh）讀 /run/secrets/crowdsec_machine_password。
services:
  nginxwebui:
    environment:
      CROWDSEC_BOUNCER_KEY: ""
      CROWDSEC_MACHINE_PASSWORD: ""
    secrets:
      - crowdsec_bouncer_key
      - crowdsec_machine_password

  crowdsec:
    environment:
      BOUNCER_KEY_nginx: ""
      AGENT_PASSWORD: ""
    secrets:
      - source: crowdsec_bouncer_key
        target: bouncer_key_nginx
      - crowdsec_machine_password

secrets:
  crowdsec_bouncer_key:
    file: ./secrets/crowdsec_bouncer_key
  crowdsec_machine_password:
    file: ./secrets/crowdsec_machine_password
