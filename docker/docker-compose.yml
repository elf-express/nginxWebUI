services:
  nginxwebui:
    # 預設拉 ghcr.io release image。要釘版本：在 docker/.env 設 NGINX_WEBUI_VERSION=x.y.z
    # 本機從原始碼 build：見 docker-compose.dev.yml
    #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
    image: ghcr.io/elf-express/nginxwebui:${NGINX_WEBUI_VERSION:-latest}
    container_name: nginxwebui
    restart: unless-stopped
    ports:
      - "12300:8080"
      - "80:80"
      - "443:443"
    volumes:
      - nginxwebui_data:/home/nginxWebUI
      - nginxwebui_log:/home/nginxWebUI/log
      - nginxwebui_geoip:/etc/nginx/geoip  # MMDB ~80 MB，restart 不重抓；crontab 每週三六自動更新
    environment:
      JVM_XMX: 256m
      # CrowdSec（profile security）：nginx 內的 Lua bouncer 直接問 crowdsec 容器，不經第三方 bouncer。
      # CROWDSEC_BOUNCER_KEY 留空 = 不載入 bouncer；有值時務必同時啟用 security profile（見 .env.example）。
      # 金鑰也可改走 secrets 檔（docker-compose.secrets.yml），nginxWebUI 優先讀 /run/secrets/crowdsec_bouncer_key。
      CROWDSEC_LAPI_URL: http://crowdsec:8080
      CROWDSEC_APPSEC_URL: http://crowdsec:7422
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY:-}
      # 後台管理封鎖用的 CrowdSec machine 帳號（JWT）。密碼留空 = 後台不能新增／刪除封鎖、不能推送 ASN，
      # CrowdSec 照常封鎖。crowdsec 容器每次啟動都用同一組密碼註冊（或更新）這個帳號。
      # 密碼也可改走 secrets 檔（docker-compose.secrets.yml），nginxWebUI 優先讀 /run/secrets/crowdsec_machine_password。
      CROWDSEC_MACHINE_ID: ${CROWDSEC_MACHINE_ID:-nginxwebui}
      CROWDSEC_MACHINE_PASSWORD: ${CROWDSEC_MACHINE_PASSWORD:-}
      # 自架驗證頁（E-387，見 docs/crowdsec-challenge.md）：cookie 金鑰留空 = 套用設定時自動產生並存檔；
      # 交接票金鑰只有「外部驗證站」模式需要，要與外部驗證站（Cloudflare Worker）設成同一把。
      # 兩把都可改走 secrets 檔 /run/secrets/nwu_challenge_secret、/run/secrets/nwu_challenge_ticket_secret。
      NWU_CHALLENGE_SECRET: ${NWU_CHALLENGE_SECRET:-}
      NWU_CHALLENGE_TICKET_SECRET: ${NWU_CHALLENGE_TICKET_SECRET:-}
      # 首次啟動會在 web UI 引導設定管理員密碼（原作者設計）。
      # 自動化部署需跳過精靈時，在 .env 設 INIT_ADMIN/INIT_PASS 並把
      #   --init.admin=${INIT_ADMIN} --init.pass=${INIT_PASS}
      # 加回 BOOT_OPTIONS 後重啟。詳見 InitConfig.java:660 addAdmin() 行為。
      # nginx 文件 MCP：在 .env 設 MCP_TOKEN 即啟用 /mcp；留空則不啟用（/mcp 回 404）。
      # >- 會把下列各行以空白接成一行，一個參數一行。
      BOOT_OPTIONS: >-
        --spring.database.type=postgresql
        --spring.datasource.url=jdbc:postgresql://postgres:5432/nginxwebui
        --spring.datasource.username=nginxwebui
        --spring.datasource.password=nginxwebui123
        --mcp.token=${MCP_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  postgres:
    # postgres 18-alpine：18+ image PGDATA 慣例改為 mount /var/lib/postgresql（不是 /data 子目錄），
    # 由 image entrypoint 自動建 <version>/data/ 子目錄。
    image: postgres:18-alpine
    container_name: nginxwebui-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=nginxwebui
      - POSTGRES_USER=nginxwebui
      - POSTGRES_PASSWORD=nginxwebui123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nginxwebui"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # ── 安全防護 ──────────────────────────────────

  crowdsec:
    image: ghcr.io/elf-express/nginxwebui-crowdsec:${NGINX_WEBUI_VERSION:-latest}
    container_name: nginxwebui-crowdsec
    restart: unless-stopped
    profiles: ["security"]
    # config（acquis/profiles/abuseipdb）與 hub 內容（nginx 日誌解析、AppSec WAF 規則）都烤進自建 image
    # （見 docker/crowdsec/Dockerfile），不再 bind mount，升版跟著 image 走。runtime secret 仍走 .env。
    # LAPI 8080、AppSec 7422 只在 compose 網路內，不 publish。
    volumes:
      - nginxwebui_log:/var/log/nginx:ro
      - crowdsec_data:/var/lib/crowdsec/data
    environment:
      # 向 LAPI 註冊名為 nginx 的 bouncer；留空則不註冊
      - BOUNCER_KEY_nginx=${CROWDSEC_BOUNCER_KEY:-}
      # 註冊 nginxWebUI 後台用的 machine 帳號（官方啟動腳本 AGENT_USERNAME + AGENT_PASSWORD → cscli machines add --force）；
      # 密碼留空則不註冊
      - AGENT_USERNAME=${CROWDSEC_MACHINE_ID:-nginxwebui}
      - AGENT_PASSWORD=${CROWDSEC_MACHINE_PASSWORD:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
    healthcheck:
      test: ["CMD", "cscli", "version"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  nginxwebui_data:
    name: nginxwebui_data
  nginxwebui_log:
    name: nginxwebui_log
  postgres_data:
    name: nginxwebui_postgres_data
  crowdsec_data:
    name: nginxwebui_crowdsec_data
  nginxwebui_geoip:
    name: nginxwebui_geoip
