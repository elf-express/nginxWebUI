<!DOCTYPE HTML>
<html>
<head>
<#include "/adminPage/common.html"/>
<link href="${ctx}/js/spa/basic.css?v=${jsrandom}" rel="stylesheet" />
</head>
<body class="layui-layout-body">
	<div class="layui-layout layui-layout-admin">

		<#include "/adminPage/header.html"/>
		<#include "/adminPage/menu.html"/>

		<div class="layui-body">
			<!-- 內容區由 Vue 掛載（frontend/src/pages/basic/），bundle 載入失敗時改開舊版頁 -->
			<div id="app"></div>
		</div>
	</div>

	<#include '/adminPage/script.html'/>
	<script>
		// bundle 解析或執行丟錯時 onerror 不會觸發；Vue 掛載完成會設 window.__spaBooted，之前的 /js/spa/ 腳本錯誤就改開舊版頁
		window.addEventListener('error', function (e) {
			if (!window.__spaBooted && e.filename && e.filename.indexOf('/js/spa/') !== -1) {
				location.replace(location.pathname + '?legacy=1');
			}
		});
	</script>
	<script type="module" src="${ctx}/js/spa/basic.js?v=${jsrandom}" onerror="location.replace(location.pathname + '?legacy=1')"></script>
</body>
</html>
